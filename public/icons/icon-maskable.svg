<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="115" ry="115"/>
    </clipPath>
    <mask id="icon-cutout">
      <rect x="0" y="0" width="512" height="512" fill="black"/>
      <!-- Speech bubble body -->
      <circle cx="256" cy="252" r="168" fill="white"/>
      <!-- Speech bubble tail at bottom right -->
      <path d="M 332 396 L 404 422 L 392 342 Z" fill="white"/>
      
      <!-- Cutout diagonal ray slash (top right) -->
      <line x1="305" y1="203" x2="395" y2="113" stroke="black" stroke-width="18" stroke-linecap="round"/>
      
      <!-- Cutout bulb outline (thick orange gap around bulb) -->
      <path d="M 256 154 C 202 154 166 192 166 240 C 166 268 180 288 196 306 C 206 318 212 328 214 342 L 298 342 C 300 328 306 318 316 306 C 332 288 346 268 346 240 C 346 192 310 154 256 154 Z" fill="none" stroke="black" stroke-width="24" stroke-linejoin="round"/>
      
      <!-- Cutout bulb base rings -->
      <rect x="208" y="340" width="96" height="24" rx="12" fill="black"/>
      <rect x="218" y="366" width="76" height="22" rx="11" fill="black"/>
      <path d="M 234 388 Q 256 404 278 388" fill="none" stroke="black" stroke-width="14" stroke-linecap="round"/>
      
      <!-- Cutout vertical stem at bottom -->
      <line x1="256" y1="392" x2="256" y2="430" stroke="black" stroke-width="16" stroke-linecap="round"/>
    </mask>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- Solid Orange Background -->
    <rect x="0" y="0" width="512" height="512" fill="#F95909"/>

    <!-- Black Speech Bubble with Bulb Cutout -->
    <rect x="0" y="0" width="512" height="512" fill="#050505" mask="url(#icon-cutout)"/>

    <!-- Black Bulb Base Rings inside cutout -->
    <rect x="218" y="346" width="76" height="11" rx="5.5" fill="#050505"/>
    <rect x="226" y="368" width="60" height="10" rx="5" fill="#050505"/>
    <path d="M 240 387 Q 256 397 272 387" fill="none" stroke="#050505" stroke-width="8" stroke-linecap="round"/>

    <!-- Orange Inner Highlight Arc inside Black Bulb -->
    <path d="M 196 238 C 196 206 218 184 246 180" fill="none" stroke="#F95909" stroke-width="12" stroke-linecap="round"/>

    <!-- Orange Rays inside the top arc of the black bubble -->
    <line x1="150" y1="168" x2="174" y2="184" stroke="#F95909" stroke-width="13" stroke-linecap="round"/>
    <line x1="196" y1="126" x2="208" y2="152" stroke="#F95909" stroke-width="13" stroke-linecap="round"/>
    <line x1="256" y1="112" x2="256" y2="140" stroke="#F95909" stroke-width="13" stroke-linecap="round"/>
    <line x1="316" y1="126" x2="304" y2="152" stroke="#F95909" stroke-width="13" stroke-linecap="round"/>
    <line x1="362" y1="168" x2="338" y2="184" stroke="#F95909" stroke-width="13" stroke-linecap="round"/>

    <!-- Black Sparkle Rays outside top-right of bubble -->
    <line x1="366" y1="74" x2="362" y2="104" stroke="#050505" stroke-width="13" stroke-linecap="round"/>
    <line x1="406" y1="96" x2="386" y2="118" stroke="#050505" stroke-width="13" stroke-linecap="round"/>
    <line x1="428" y1="136" x2="398" y2="142" stroke="#050505" stroke-width="13" stroke-linecap="round"/>
  </g>
</svg>