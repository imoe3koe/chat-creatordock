<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="0" y="0" width="512" height="512" rx="115" ry="115" />
    </clipPath>
    <mask id="bubble-cutouts">
      <!-- White keeps the orange speech bubble visible, black cuts through to the black background -->
      <rect x="0" y="0" width="512" height="512" fill="white" />
      
      <!-- 1. Diagonal burst cut in upper-right of the speech bubble -->
      <line x1="312" y1="194" x2="386" y2="120" stroke="black" stroke-width="14" stroke-linecap="round" />
      
      <!-- 2. Inner rays inside the speech bubble (4 rounded strokes) -->
      <line x1="172" y1="185" x2="188" y2="195" stroke="black" stroke-width="11" stroke-linecap="round" />
      <line x1="210" y1="146" x2="219" y2="164" stroke="black" stroke-width="11" stroke-linecap="round" />
      <line x1="256" y1="133" x2="256" y2="154" stroke="black" stroke-width="11" stroke-linecap="round" />
      <line x1="302" y1="146" x2="293" y2="164" stroke="black" stroke-width="11" stroke-linecap="round" />
      
      <!-- 3. Lightbulb main outline -->
      <path d="M 256 182
               C 214 182, 184 212, 184 251
               C 184 275, 198 294, 211 312
               C 218 322, 222 332, 223 343
               L 289 343
               C 290 332, 294 322, 301 312
               C 314 294, 328 275, 328 251
               C 328 212, 298 182, 256 182 Z"
            fill="none" stroke="black" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" />
            
      <!-- 4. Inner highlight curve inside the bulb (top-left) -->
      <path d="M 213 244 C 213 221, 229 206, 250 205"
            fill="none" stroke="black" stroke-width="9.5" stroke-linecap="round" />
            
      <!-- 5. Lightbulb screw base rings -->
      <rect x="224" y="343" width="64" height="19" rx="9.5" ry="9.5"
            fill="none" stroke="black" stroke-width="11" />
      <path d="M 233 362 L 279 362 C 279 374, 270 382, 256 382 C 242 382, 233 374, 233 362 Z"
            fill="none" stroke="black" stroke-width="11" stroke-linejoin="round" />
            
      <!-- 6. Bottom vertical stem connecting bulb base to bottom edge of bubble -->
      <line x1="256" y1="382" x2="256" y2="416" stroke="black" stroke-width="12" stroke-linecap="round" />
    </mask>
  </defs>

  <!-- Main App Icon Container (512x512 rounded square) -->
  <g clip-path="url(#squircle-clip)">
    <!-- Solid Flat Black Background -->
    <rect x="0" y="0" width="512" height="512" fill="#000000" />
    
    <!-- Orange Speech Bubble with Black Cutouts -->
    <g mask="url(#bubble-cutouts)">
      <path d="M 256 104
               C 167 104, 96 172, 96 256
               C 96 340, 167 408, 256 408
               C 278 408, 299 404, 318 396
               L 392 414
               L 375 344
               C 401 319, 416 289, 416 256
               C 416 172, 345 104, 256 104 Z"
            fill="#F95909" />
    </g>
    
    <!-- 3 Exterior Orange Spark Rays at Upper-Right -->
    <line x1="364" y1="115" x2="367" y2="87" stroke="#F95909" stroke-width="11.5" stroke-linecap="round" />
    <line x1="384" y1="127" x2="407" y2="105" stroke="#F95909" stroke-width="11.5" stroke-linecap="round" />
    <line x1="395" y1="147" x2="423" y2="143" stroke="#F95909" stroke-width="11.5" stroke-linecap="round" />
  </g>
</svg>
